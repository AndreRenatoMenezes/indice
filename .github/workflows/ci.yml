name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: indice, POSTGRES_PASSWORD: indice, POSTGRES_DB: indice }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U indice" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://indice:indice@localhost:5432/indice?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: apps/android
